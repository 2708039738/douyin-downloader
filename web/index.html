<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抖音视频下载器</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --ink:#111318;
    --muted:#6b7280;
    --line:#e7e9ee;
    --accent:#fe2c55;
    --accent-soft:#ffe9ee;
    --cyan:#25f4ee;
    --ok:#12a150;
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:860px;margin:0 auto;padding:32px 20px 80px}

  header{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;
    background:linear-gradient(135deg,#fe2c55,#ff6a8a 60%,#25f4ee 140%);
    display:grid;place-items:center;box-shadow:0 6px 18px rgba(254,44,85,.24);
  }
  .logo svg{width:24px;height:24px}
  h1{font-size:20px;margin:0 0 3px;letter-spacing:.2px}
  .sub{margin:0;font-size:13px;color:var(--muted)}
  .spacer{flex:1}
  .ghost{
    border:1px solid var(--line);background:#fff;color:#374151;border-radius:10px;
    padding:8px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:.16s;
  }
  .ghost:hover{border-color:#cfd4de;background:#fafbfc}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -18px rgba(16,24,40,.2);
  }
  textarea{
    width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:14px;line-height:1.65;font-family:inherit;color:var(--ink);
    background:#fcfcfd;outline:none;transition:.15s;
  }
  textarea:focus{border-color:#ffb3c2;background:#fff;box-shadow:0 0 0 4px rgba(254,44,85,.08)}
  textarea::placeholder{color:#a2a8b5}

  .controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .seg{display:inline-flex;background:#f2f3f6;border-radius:11px;padding:3px;gap:2px}
  .seg button{
    border:0;background:transparent;color:#5b6270;font-size:13px;padding:7px 14px;border-radius:9px;
    cursor:pointer;font-family:inherit;transition:.15s;font-weight:500;
  }
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  .seg button.on.wm-on{color:var(--accent)}
  select{
    border:1px solid var(--line);border-radius:10px;background:#fff;color:#374151;
    padding:8px 10px;font-size:13px;font-family:inherit;cursor:pointer;outline:none;
  }
  .chk{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#5b6270;
    cursor:pointer;user-select:none;padding:2px 2px 2px 0;
  }
  .chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
  .conn{
    font-size:12px;color:#9aa1ad;display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;border-radius:9px;background:#f5f6f8;
  }
  .conn i{width:7px;height:7px;border-radius:50%;background:#e0a33a;flex:0 0 auto}
  .conn.ok{color:#0f8a45;background:#eaf7ef}
  .conn.ok i{background:#12a150;box-shadow:0 0 0 3px rgba(18,161,80,.15)}
  .grow{flex:1}
  .primary{
    border:0;border-radius:11px;padding:11px 22px;font-size:14px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,#fe2c55,#ff5470);cursor:pointer;font-family:inherit;
    box-shadow:0 6px 16px -6px rgba(254,44,85,.6);transition:.16s;
  }
  .primary:hover{transform:translateY(-1px);box-shadow:0 10px 20px -8px rgba(254,44,85,.65)}
  .primary:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
  .hint{font-size:12px;color:#9aa1ad;margin:10px 2px 0}

  .list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .job{
    display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px;animation:in .22s ease-out;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .thumb{
    width:62px;height:82px;border-radius:10px;flex:0 0 auto;object-fit:cover;
    background:linear-gradient(135deg,#eef0f4,#e3e6ec);display:block;
  }
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .t{font-size:14px;font-weight:600;line-height:1.45;margin:0;
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tag{background:#f3f4f7;border-radius:6px;padding:2px 7px;font-size:11.5px;color:#565d6b}
  .tag.acc{background:var(--accent-soft);color:#d81e45}
  .bar{height:5px;border-radius:99px;background:#eef0f4;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,#fe2c55,#ff7b93);transition:width .25s}
  .bar.done i{background:linear-gradient(90deg,#12a150,#3ecf7f)}
  .status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .status.err{color:#d81e45}
  .status.ok{color:var(--ok)}
  .spin{width:12px;height:12px;border-radius:50%;border:2px solid #e6e8ee;border-top-color:var(--accent);
        animation:sp .7s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .acts{display:flex;gap:6px;align-items:center}
  .mini{
    border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;
    color:#4b5563;cursor:pointer;font-family:inherit;transition:.15s;text-decoration:none;
  }
  .mini:hover{border-color:#cfd4de;background:#fafbfc}
  .mini.pri{background:var(--ink);border-color:var(--ink);color:#fff}
  .mini.pri:hover{background:#000}
  .empty{
    text-align:center;color:#a6acb8;font-size:13px;padding:46px 0 30px;
  }
  .empty svg{opacity:.5;margin-bottom:10px}
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);
    background:#111318;color:#fff;font-size:13px;padding:11px 18px;border-radius:11px;
    opacity:0;pointer-events:none;transition:.25s;max-width:80vw;z-index:9;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{margin-top:26px;text-align:center;font-size:11.5px;color:#a6acb8;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/>
      </svg>
    </div>
    <div>
      <h1>抖音视频下载器</h1>
      <p class="sub">粘贴分享链接，选好水印方式，一键存到本地</p>
    </div>
    <div class="spacer"></div>
    <span class="conn" id="conn" title="本地服务状态"><i></i><span>未连接</span></span>
    <button class="ghost" id="openFolder">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      打开下载文件夹
    </button>
  </header>

  <section class="panel">
    <textarea id="input" placeholder="把抖音分享链接粘到这里，一行一个。整段分享文案也没关系，会自动识别链接。"></textarea>
    <div class="controls">
      <div class="seg" id="wmSeg">
        <button data-wm="0" class="on">无水印</button>
        <button data-wm="1">带水印</button>
      </div>
      <select id="quality" title="清晰度">
        <option value="auto">最高画质</option>
        <option value="1080">1080P</option>
        <option value="720">720P</option>
        <option value="540">540P</option>
      </select>
      <label class="chk" title="H.264 兼容性最好；取消勾选可下到更高清的 H.265">
        <input type="checkbox" id="h264" checked> H.264 优先
      </label>
      <div class="grow"></div>
      <button class="primary" id="go">开始下载</button>
    </div>
    <p class="hint">无水印走原片地址，画质最高；带水印是抖音官方的下载版。图集会自动打包成 zip。默认优先 H.264，任何播放器都能开。</p>
  </section>

  <div class="list" id="list"></div>

  <footer>
    仅供个人学习与备份使用，请尊重原作者版权，不要用于搬运或商业传播。<br>
    文件保存在程序目录的 downloads 文件夹里。
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const list = $('#list');
let jobs = [];
let watermark = false;

// ---- 水印切换 ----
$('#wmSeg').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  watermark = btn.dataset.wm === '1';
  [...$('#wmSeg').children].forEach(b => b.classList.toggle('on', b === btn));
  btn.classList.toggle('wm-on', watermark && btn.classList.contains('on'));
});

// ---- 提交 ----
$('#go').addEventListener('click', submit);
$('#input').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submit();
});

async function submit() {
  const text = $('#input').value.trim();
  if (!text) { toast('先粘一条链接进来'); return; }
  $('#go').disabled = true;
  try {
    const r = await fetch('/api/parse', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, watermark, quality: $('#quality').value,
                            prefer_h264: $('#h264').checked})
    });
    const data = await r.json();
    if (!r.ok) { toast(data.error || '解析失败'); return; }
    $('#input').value = '';
    toast(`已加入 ${data.created.length} 个任务`);
    poll();
  } catch (e) {
    toast('连不上本地服务：先双击「网页版.bat」启动，再刷新这一页');
  } finally {
    $('#go').disabled = false;
  }
}

$('#openFolder').addEventListener('click', async () => {
  const r = await fetch('/api/open-folder', {method: 'POST'});
  const d = await r.json();
  if (d.error) toast(d.error);
});

// ---- 轮询 ----
function setConn(ok) {
  const el = $('#conn');
  if (!el) return;
  el.classList.toggle('ok', ok);
  const label = el.querySelector('span');
  const text = ok ? '服务已连接' : '未连接';
  if (label.textContent !== text) label.textContent = text;
}

async function poll() {
  try {
    const r = await fetch('/api/jobs');
    const d = await r.json();
    jobs = d.jobs || [];
    setConn(true);
    render();
  } catch (e) {
    setConn(false);
  }
}

function human(n) {
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function render() {
  if (!jobs.length) {
    if (!list.dataset.empty) {
      list.dataset.empty = '1';
      list.innerHTML = `<div class="empty">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c8ccd4" stroke-width="1.6">
          <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z" fill="#c8ccd4" stroke="none"/>
        </svg>
        <div>还没有任务，粘一条链接试试</div>
      </div>`;
    }
    return;
  }
  if (list.dataset.empty) { list.dataset.empty = ''; list.innerHTML = ''; list.dataset.ids = ''; }

  const ids = jobs.map(j => j.id).join(',');
  if (list.dataset.ids !== ids) {
    list.dataset.ids = ids;
    list.innerHTML = jobs.map(jobHTML).join('');
  }
  jobs.forEach(updateJob);
}

function jobHTML(j) {
  const cover = j.thumb
    ? `<img class="thumb" src="/api/thumb?id=${j.id}" alt="">`
    : `<div class="thumb"></div>`;
  return `<div class="job" data-id="${j.id}">
    ${cover}
    <div class="body">
      <p class="t" data-f="title"></p>
      <div class="meta">
        <span data-f="author"></span>
        <span class="tag" data-f="quality"></span>
        <span class="tag" data-f="dur"></span>
        <span class="tag" data-f="size"></span>
      </div>
      <div class="bar"><i></i></div>
      <div class="status"><span class="spin" style="display:none"></span><span data-f="status"></span></div>
    </div>
    <div class="acts" data-f="acts"></div>
  </div>`;
}

function updateJob(j) {
  const el = list.querySelector(`.job[data-id="${j.id}"]`);
  if (!el) return;
  const set = (f, v) => { const n = el.querySelector(`[data-f="${f}"]`); if (n && n.textContent !== v) n.textContent = v; };
  let title = j.title;
  if (!title) {
    title = j.status === 'error' ? '解析失败'
          : j.status === 'parsing' ? '正在解析…' : '排队中…';
  }
  set('title', title);
  set('author', j.author ? '@' + j.author : '');
  set('quality', j.quality_label || (j.is_gallery ? '图集' : ''));
  set('dur', j.duration_text || '');
  set('size', j.status === 'done' ? human(j.size) : (j.size ? human(j.received) + ' / ' + human(j.size) : ''));

  const bar = el.querySelector('.bar');
  const fill = bar.querySelector('i');
  const pct = j.status === 'done' ? 100 : (j.percent || 0);
  fill.style.width = (j.status === 'parsing' ? 8 : pct) + '%';
  bar.classList.toggle('done', j.status === 'done');

  const spin = el.querySelector('.spin');
  spin.style.display = (j.status === 'downloading' || j.status === 'parsing' || j.status === 'queued') ? 'block' : 'none';

  const st = el.querySelector('.status');
  st.className = 'status' + (j.status === 'error' ? ' err' : j.status === 'done' ? ' ok' : '');
  let text = '';
  if (j.status === 'queued') text = '排队中';
  else if (j.status === 'parsing') text = '正在解析视频信息…';
  else if (j.status === 'downloading') text = j.speed ? `下载中 ${human(j.speed)}/s` : '下载中…';
  else if (j.status === 'done') text = '已保存到 downloads';
  else if (j.status === 'error') text = j.error;
  set('status', text);

  const acts = el.querySelector('[data-f="acts"]');
  let html = '';
  if (j.status === 'done') {
    html += `<a class="mini pri" href="/api/file?id=${j.id}">另存为</a>`;
  }
  if (j.status === 'error') {
    html += `<button class="mini" data-act="retry">重试</button>`;
  }
  if (j.status === 'done' || j.status === 'error') {
    html += `<button class="mini" data-act="remove" title="删除任务与文件">删</button>`;
  }
  if (acts.dataset.h !== html) { acts.dataset.h = html; acts.innerHTML = html; }
}

list.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.closest('.job').dataset.id;
  const act = btn.dataset.act;
  if (act === 'retry') {
    await fetch('/api/retry', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
  } else if (act === 'remove') {
    await fetch('/api/remove', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})});
  }
  poll();
});

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// 有任务在跑的时候刷新快一点
setInterval(() => {
  const busy = jobs.some(j => j.status !== 'done' && j.status !== 'error');
  poll();
}, 900);
poll();
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 项目零第三方依赖，所以这里没有 pip install 这一步
      - name: 编译检查
        run: python -m compileall -q app.py core.py webui.py tests

      - name: 冒烟测试
        run: |
          python -c "import app, core, webui"
          python app.py -h

      - name: 单元测试
        run: python -m unittest discover -s tests -v
